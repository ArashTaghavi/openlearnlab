
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openlearnlab"
version = "0.1.0"
description = "A free and open learning lab for understanding technical concepts through practical examples, from-scratch implementations, experiments, and comparisons."
readme = "README.md"
requires-python = ">=3.14"
license = "0BSD"

keywords = [
    "education",
    "open-learning",
    "hands-on-learning",
    "from-scratch",
    "experiments",
    "tutorials",
    "machine-learning",
    "deep-learning",
    "artificial-intelligence",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "xgboost",
    "lightgbm",
    "catboost",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "build",
    "twine",
    "jupyterlab",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]
